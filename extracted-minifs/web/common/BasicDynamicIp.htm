<script type="text/javascript">function init(){var updateTimerHandle;function updateStatus(){if(LINK_TYPE_DHCP==parseInt(link.linkType)){$.readNonBlock(LINK_STATUS_DATA_ID,function(){var status=$.findBlock(LINK_STATUS_DATA_ID);var bNwNote=id("bNwNote");var vis="hidden";id("ip").innerHTML="0.0.0.0";id("mask").innerHTML="0.0.0.0";id("gateway").innerHTML="0.0.0.0";id("dns").innerHTML="0.0.0.0 , 0.0.0.0";bEptNetWorkSet(status.status,linkType[LINK_TYPE_DHCP]);switch(parseInt(status.status)){case LINK_UP:var dnsStr="";id("ip").innerHTML=status.ip;id("mask").innerHTML=status.mask;id("gateway").innerHTML=status.gateway;dnsStr=status.dns[0]+" , "+status.dns[1];if("0.0.0.0"==status.dns[0]&&"0.0.0.0"==status.dns[1]){dnsStr+=(" "+label.dnsException)}id("dns").innerHTML=dnsStr;break;case LINK_DOWN:if(status.code>=LINK_CODE_UNKNOWN){bNwNote.innerHTML=linkCode[status.code];vis="visible"}break;default:break}$("div.bNwConnectS").css("visibility",vis);$.setTimeout(updateStatus,2000)})}}var link=$.findBlock(LINK_DATA_ID);id("saveImg").onclick=function(){var errNo=ENONE;if(LINK_TYPE_DHCP==link.linkType){errNo=$.instr("wan -linkUp").errorno;return}link.linkType=LINK_TYPE_DHCP;setLoadingId("saveImg",true);errNo=$.write($.toText(link),$.block);if(ENONE!=errNo){$.read(LINK_DATA_ID)}else{updateStatus()}};$("div.bFunc")[0].style.visibility="visible";updateStatus()}init();</script>
