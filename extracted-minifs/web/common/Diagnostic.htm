<script type="text/javascript">function init(){var subBtnId="start";var doType1Id="doType1";var doType2Id="doType2";var sendNumId="sendNum";var pingSizeId="pSize";var pingOverTimeId="overTime";var tracertHopsId="trHops";var addrId="addr";var icmpId=null;var cmdType;var DIAGNOSE_START=0,DIAGNOSE_STOP=1,DIAGNOSE_LOOKUP=2;function updateResult(){var cmd;if(null==icmpId){id(subBtnId).value=btn.start;return}cmd="systool "+cmdType+" code:"+DIAGNOSE_LOOKUP+" icmpId:"+icmpId;$.instr(cmd,function(result){var pos,finished,diagResult;if(ENONE!=result.errorno){id(subBtnId).value=btn.start;return}pos=result.data.indexOf("\r\n");finished=result.data.substring(0,pos);diagResult=result.data.substring(pos+2,result.data.length);id("diagnostResult").innerHTML="<pre>"+diagResult.replace(/\r\n/gi,"<br />")+"</pre>";listScroll.scrollTo(id("diagnostResult").offsetHeight);if(1==finished){subBtn=id(subBtnId);subBtn.value=btn.start;cmd="systool "+cmdType+" code:"+DIAGNOSE_STOP+" icmpId:"+icmpId;if(ENONE==$.instr(cmd).errorno){icmpId=null}return}$.setTimeout(updateResult,1000)})}function chooseSwitch(){var dis=id(doType2Id).checked;disableInput(sendNumId,dis);disableInput(pingSizeId,dis);disableInput(pingOverTimeId,dis);disableInput(tracertHopsId,!dis)}function addrSub(event){event=event||window.event;var keyCode=event.keyCode;if(13==keyCode){doSub()}}function checkPara(){var error;var addrValue=addr.value;if(addrValue.length==0){showAlert(errStr.inputIpErr,addr);return false}if(/[a-zA-z]/g.test(addrValue)==true){if(ENONE!=checkDomain(addrValue)){showAlert(errStr.domainErr,addr);return false}}else{if(ENONE!=validIpFormat(addrValue)){showAlert(errStr.ipAddrFmtErr,addr);return false}if(ENONE!=validIpAddr(addrValue)){showAlert(errStr.ipAddrNetErr,addr);return false}}if(id(doType1Id).checked){if(true!=checkNumRange(id(sendNumId).value,50,1)){showAlert(errStr.pingNumErr,sendNumId);return false}if(true!=checkNumRange(id(pingSizeId).value,1472,4)){showAlert(errStr.pingSizeErr,pingSizeId);return false}if(true!=checkNumRange(id(pingOverTimeId).value,2000,100)){showAlert(errStr.overtimeErr,pingOverTimeId);return false}}if(id(doType2Id).checked){if(true!=checkNumRange(id(tracertHopsId).value,30,1)){showAlert(errStr.hopsErr,tracertHopsId);return false}}return true}function loginDomainIp(domain){var login=$.findBlock(TPDOMAIN_DATA_ID);var lan=$.findBlock(LAN_DATA_ID);return domain==login.name?lan.ip:domain}function doSub(){var subBtn,cmd,result,diagnoseResult=id("diagnostResult");subBtn=id(subBtnId);if((btn.start==subBtn.value)&&(false!=checkPara())){subBtn.value=btn.end;if(id(doType1Id).checked){cmd="systool ping code:"+DIAGNOSE_START+" target:"+loginDomainIp(addr.value)+" size:"+id(pingSizeId).value+" metric:"+id(sendNumId).value+" timeout:"+id(pingOverTimeId).value;cmdType="ping"}else{cmd="systool tracert code:"+DIAGNOSE_START+" target:"+loginDomainIp(addr.value)+" metric:"+id(tracertHopsId).value;cmdType="tracert"}setLoadingId(subBtnId);result=$.instr(cmd);if(ENONE==result.errorno){icmpId=parseInt(result.data);diagnoseResult.innerHTML="<pre></pre>";updateResult()}}else{if(btn.end==subBtn.value){subBtn.value=btn.start;cmd="systool "+cmdType+" code:"+DIAGNOSE_STOP+" icmpId:"+icmpId;setLoadingId(subBtnId);if(ENONE==$.instr(cmd).errorno){icmpId=null;diagnoseResult.innerHTML=(diagnoseResult.innerHTML).replace(/<\/pre>/gi,"<br />***** User canceled *****<br /></pre>");listScroll.scrollTo(diagnoseResult.offsetHeight)}}}}$.read(TPDOMAIN_DATA_ID+"#"+LAN_DATA_ID);var addr=id(addrId);id(sendNumId).value=4;id(pingSizeId).value=64;id(pingOverTimeId).value=800;id(tracertHopsId).value=20;id(doType1Id).checked="true";chooseSwitch();id(doType1Id).onclick=chooseSwitch;id(doType2Id).onclick=chooseSwitch;id(subBtnId).onclick=doSub;addr.onkeyup=addrSub;addr.focus();var n=0;var listScroll;listScroll=new NiceScroll("textareaDiagCon");listScroll.scrollTipOpacity(1);listScroll.init()}init();</script>
