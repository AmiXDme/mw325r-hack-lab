<script type="text/javascript">function init(){var bLinkStatus=false;var bLinkStatusHd;var bWirelessLinked=false;var staDataObj=$.readEx(STARTTABLE_DATA_ID);function bEptGetLocalInfi(){var localInfo,item;var pos,result=$.getPeerMac();if(ENONE!=result.errorno||""==result.data){return}localInfo=result.data;pos=localInfo.indexOf("\r\n");if(pos>0){localInfo=localInfo.substring(0,pos)}for(var index=0,len=staDataObj.list.length;index<len;index++){item=staDataObj.list[index];if(item.mac==localInfo){if(item.type>0){bWirelessLinked=true}break}}}bEptGetLocalInfi();wzdConSet({height:"480px"});wzdStopSet();id("pre").onclick=function(){loadPage("WizardWireless.htm","wizardCon",doNothing)};id("sub").onclick=function(){var data="",link=$.findBlock(LINK_DATA_ID);var stcIp=$.findBlock(STATIC_IP_DATA_ID),pppoe=$.findBlock(PPPOE_DATA_ID),pptp=$.findBlock(PPTP_DATA_ID),l2tp=$.findBlock(L2TP_DATA_ID);var mbssid=$.findBlock(MBSSID_MAIN_DATA_ID);var wlanBasic=$.findBlock(WLAN_BASIC_DATA_ID);switch(parseInt(link.linkType)){case LINK_TYPE_DHCP:data=$.toText(link);break;case LINK_TYPE_PPPOE:data=$.toText(pppoe)+$.toText(link);break;case LINK_TYPE_STATIC_IP:data=$.toText(stcIp)+$.toText(link);break;case LINK_TYPE_L2TP:data=$.toText(l2tp)+$.toText(link);break;case LINK_TYPE_PPTP:data=$.toText(pptp)+$.toText(link);break;default:break}if(true==wzdWirelessChanged){data+=$.toText(mbssid)}$.write(data,$.block);if(true==wzdWirelessChanged&&true==bWirelessLinked){$.setResetSign(1);function bLinkStatusDetect(){$.detect(function(){if(0!=$.result.data.length&&false==bLinkStatus){bLinkStatus=true;wzdStop()}});bLinkStatusHd=$.setTimeout(bLinkStatusDetect,2500)}bLinkStatus=false;clearTimeout(bLinkStatusHd);$("i.wirelessChg").css("display","none");$("li.lgBtns").css("visibility","hidden");$("img.wirelessChgDetecting").css("display","inline");$("p.wirelessChgTip")[0].innerHTML=label.wirelessLinkTip;$("span.wizardSkip").css("visibility","hidden");$.setTimeout(bLinkStatusDetect,3000)}else{wzdStop()}};if(false=
