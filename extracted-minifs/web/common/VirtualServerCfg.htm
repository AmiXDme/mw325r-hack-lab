<script type="text/javascript">function init(){var ENOPORTINPUT=-1;var portArray=new Array({str:label.pSelect,value:-1,protocol:0},{str:"DNS",value:53,protocol:0},{str:"FTP",value:21,protocol:1},{str:"Gopher",value:70,protocol:1},{str:"HTTP",value:80,protocol:1},{str:"NNTP",value:119,protocol:1},{str:"POP3",value:110,protocol:1},{str:"PPTP",value:1723,protocol:0},{str:"SMTP",value:25,protocol:1},{str:"SOCK",value:1080,protocol:0},{str:"Telnet",value:23,protocol:1});var protocol=[{str:"ALL"},{str:"TCP"},{str:"UDP"}];function errHandle(errNo,objOrId){var showStr="";switch(errNo){case ENONE:return true;case EINVNET:showStr=errStr.ipAddrNetErr;break;case EINVIP:showStr=errStr.ipAddrErr;break;case EINVIPFMT:showStr=errStr.ipAddrFmtErr;break;case EINVGROUPIP:showStr=errStr.ipAddrGroupErr;break;case EINVLOOPIP:showStr=errStr.ipAddrLoopErr;break;case EOVERFLOW:case EINVPORT:showStr=errStr.invPortErr;break;case EINVPTC:showStr=errStr.invProtoErr;break;case EPORTRESERVED:showStr=errStr.portConflicErr;break;case ETABLEFULL:showStr=errStr.tableFullErr;break;case EENTRYNOTEXIST:showStr=errStr.entryNoExistErr;break;case EILLEGALPORT:showStr=errStr.portIllegalErr;break;case EINVPORTFMT:showStr=errStr.portIllegalFmtErr;break;case ENOPORTINPUT:showStr=errStr.noPortInputErr;break;case ENOTLANSUBNET:showStr=errStr.ipNotLanSubnet;break;default:showStr=errStr.unknown+errNo;break}showAlert(showStr,objOrId);return false}function setServerLclPort(virServer){var list=virServer.list,index=0,item=list[index];var other=portArray[0].value,temp;while((item!=undefined)&&(item.vsLclIp.length!=0)&&(item.vsLclIp!="0.0.0.0")){item.server=other;for(var para in portArray){temp=portArray[para];if((item.vsOpenPortS==temp.value)&&(item.vsPtc==temp.protocol)){item.server=temp.value;break}}if(item.vsLclPort==0){item.vsLclPortS=item.vsOpenPortS;item.vsLclPortE=item.vsOpenPortE}else{item.vsLclPortS=item.vsLclPort;item.vsLclPortE=item.vsLclPort}index++;item=list[index]}}function virSerChange(value,selectObj){var row=selectObj.parentNode.parentNode.parentNode;var value=selectObj.value;var port=getChildNode(row.cells[2],"input");var protoCon=getChildNode(row.cells[5],"div");var proto=getChildNode(protoCon,"span");port.value=((value!=-1)&&(value!=-2)?value:"");for(var para in portArray){if(portArray[para].value==value){proto.changeSel(portArray[para].protocol)}}}function virSerAllHandle(order){return errHandle($.instr(order).errorno)}function virSerLeaseRefresh(){var virServer=$.readEx(NAPT_VSERVER_DATA_ID);setServerLclPort(virServer);dataGridVs.refresh();return true}function virSerPortCheck(virSerData){if(virSerData.vsOpenPortS.length==0){return ENOPORTINPUT}if((false==checkNum(virSerData.vsOpenPortS))||(false==checkNum(virSerData.vsOpenPortE))){return EILLEGALPORT}if((false==checkNumRange(virSerData.vsOpenPortS,65535,1))||(false==checkNumRange(virSerData.vsOpenPortE,65535,1))){return EINVPORT}if(virSerData.vsLclPortS.length==0){return ENONE}if((virSerData.vsLclPortS===0)&&(virSerData.vsLclPortE===0)){return ENONE}if((false==checkNum(virSerData.vsLclPortS))||(false==checkNum(virSerData.vsLclPortE))){return EILLEGALPORT}if((false==checkNumRange(virSerData.vsLclPortS,65535,1))||(false==checkNumRange(virSerData.vsLclPortE,65535,1))){return EINVPORT}if((virSerData.vsLclPortS!=virSerData.vsLclPortE)&&((virSerData.vsLclPortS!=virSerData.vsOpenPortS)||((virSerData.vsLclPortE!=virSerData.vsOpenPortE)))){return EINVPORT}return ENONE}function virSerHandle(order,index){var virSerData=$.findBlock(NAPT_VSERVER_DATA_ID).list[index];var virSerCmd=order;var result=true;var errno=0;var portCheckResult=ENONE;portCheckResult=virSerPortCheck(virSerData);if(ENONE!=portCheckResult){return errHandle(portCheckResult)}else{if((virSerData.vsLclPortS==virSerData.vsLclPortE)&&(virSerData.vsLclPortS.length!=0)){virSerData.vsLclPort=virSerData.vsLclPortS}else{virSerData.vsLclPort=0}}virSerCmd+=" lip:"+virSerData.vsLclIp;virSerCmd+=" lport:"+virSerData.vsLclPort;virSerCmd+=" start:"+virSerData.vsOpenPortS;virSerCmd+=" end:"+virSerData.vsOpenPortE;virSerCmd+=" ptc:"+virSerData.vsPtc+" valid";errno=$.instr(virSerCmd).errorno;if(ETABLEFULL==errno){virServer.list.length-=1}if((true==(result=errHandle(errno)))&&(virSerData.vsLclPort==0)){$.setTimeout(function(){virSerLeaseRefresh()},0)}return result}function virSerDelAll(){var order="forward vs -clr";return virSerAllHandle(order)}function virSerDelSel(index){var orderBase="forward vs -delete index:";var order=orderBase;var i=0;index=index.split("-");for(i=0;i<index.length;i++){order=orderBase+index[i];if(true!=virSerHandle(order,index[i])){break}}if(i>=index.length){return true}return false}function virSerSave(mode,index){var orderAdd="forward vs -add";var orderEdit="forward vs -edit";var order=((mode=="edit")?(orderEdit+" index:"+index):orderAdd);return virSerHandle(order,index)}var dataGridVs=new DataGrid();var virServer=$.readEx(NAPT_VSERVER_DATA_ID);setServerLclPort(virServer);dataGridVs.init({id:"virServerLease",data:virServer.list,checkIndex:3,max:16,head:[{field:label.commonServer,width:80},{field:label.extPort,width:80},{field:label.intPort,width:80},{field:label.ipAddr,width:130},{field:label.ptc,width:65}],list:[{name:"server",type:"select",options:portArray,func:virSerChange,className:"gridSelectB",maxSelSize:15,defaultValue:-1,blankStr:label.pSelect},{name:"vsOpenPortS vsOpenPortE",type:"ports",maxLength:11},{name:"vsLclPortS vsLclPortE",type:"ports",maxLength:11},{name:"vsLclIp",type:"ip"},{name:"vsPtc",type:"select",options:protocol,className:"gridSelectB1",maxSelSize:6}],toolBar:{id:"virSerUl",delAll:virSerDelAll,delSel:virSerDelSel,save:virSerSave}})}init();</script>
