<script type="text/javascript">function init(){function errHandle(errNo,objOrId){var showStr="";switch(errNo){case ENONE:return true;case EINVIP:showStr=errStr.ipAddrErr;break;case EINVIPFMT:showStr=errStr.ipAddrFmtErr;break;case EINVGROUPIP:showStr=errStr.ipAddrGroupErr;break;case EINVLOOPIP:showStr=errStr.ipAddrLoopErr;break;case ENOTLANWANNET:showStr=errStr.ipAddrNotLanWanNetErr;break;case EINVMACFMT:showStr=errStr.macFmtErr;break;case EENTRYCONFLIC:showStr=errStr.entryConflicErr;break;case EENTRYEXIST:showStr=errStr.entryExistErr;break;case ESYSTEM:showStr=errStr.systemErr;break;case ETABLEFULL:showStr=errStr.tableFullErr;break;case EENTRYNOTEXIST:showStr=errStr.entryNoExistErr;break;case EIPRESERVED:showStr=errStr.ipAddrReservedErr;break;default:showStr=errStr.unknown+errNo;break}showAlert(showStr,objOrId);return false}function addToStcBind(index){var arpMapData=ipMacMap[index];var arpMapCmd="main staMgt -add bind";var result=true;arpMapCmd+=" ip:"+arpMapData.ip;arpMapCmd+=" mac:"+arpMapData.mac.toUpperCase();arpMapCmd+=" name:"+encodeURL(arpMapData.name);if(true==(result=errHandle($.instr(arpMapCmd).errorno))){$.setTimeout(ipMacMapRefresh,1000);ipMacBindRefresh()}return result}function ipMacMapTableInit(){var item,dataArr,mac;var arpMapData=$.instr("main staMgt -get arp").data;arpMapData=(""!=arpMapData)?arpMapData.split("\r\n"):[];ipMacMap=[];for(var index in arpMapData){dataArr=arpMapData[index].split("\r\r");item=ipMacMap[index]={};item.name=dataArr[0];mac=dataArr[1];item.mac=(mac==undefined?mac:mac.toUpperCase());item.ip=dataArr[2];item.bindEntry=dataArr[3];if(""==item.name){item.name=label.anonymousHost}}}function ipMacMapRefresh(){ipMacMapTableInit();dataGridMap.setDataSource(ipMacMap);dataGridMap.refresh();return true}function ipMacMapLeaseInit(){ipMacMapTableInit();dataGridMap=new DataGrid();dataGridMap.init({id:"ipMacMapLease",data:ipMacMap,head:[{field:label.host,width:140},{field:label.mac,width:175},{field:label.ipAddr,width:140},{field:label.curStatus,width:80},{field:label.ipMacMapAdd,width:100}],list:[{name:"name",maxLength:16},{name:"mac",type:"mac"},{name:"ip",type:"ip"},{name:"bindEntry",type:"strSelect",options:[{str:label.ipMacBindNoBind,value:0},{str:label.ipMacBindBind,value:1}]},{name:"bindEntry",type:"btn",value:"+",click:addToStcBind,className:"bindBtn",classNameUn:"bindBtnUn",subType:"bind"}],hasSelBox:false,checkIndex:1,edit:false,max:64,toolBar:{id:"ipMacMapLsUl",refresh:ipMacMapRefresh}})}function ipMacBindHandle(order,index){var bindEntry=ipMacList[index];var cmd=order;cmd+=" ip:"+bindEntry.ip;cmd+=" mac:"+bindEntry.mac.toUpperCase();cmd+=" name:"+encodeURL(bindEntry.name);return errHandle($.instr(cmd).errorno)}function ipMacBindDelAll(){var order="main staMgt -clr bind";var result=errHandle($.instr(order).errorno);if(true==result){$.setTimeout(ipMacMapRefresh,1000)}return result}function ipMapBindDelSel(index){var order="main staMgt -delete bind";var i=0;var result=true;index=index.split("-");for(i=0;i<index.length;i++){if(true!=(result=ipMacBindHandle(order,index[i]))){break}}if(i>0){$.setTimeout(ipMacMapRefresh,1000)}return result}function ipMapBindSave(mode,index){var data;var order="main staMgt -add bind",result=true;if("edit"==mode){if(ipMacList[index].oldMac.toUpperCase()!=ipMacList[index].mac.toUpperCase()){order="main staMgt -delete bind mac:"+ipMacList[index].oldMac.toUpperCase();if(false==errHandle($.instr(order).errorno)){return false}ipMacList[index].oldMac=ipMacList[index].mac.toUpperCase();order="main staMgt -add bind"}else{order="main staMgt -edit bind"}}if(true==(result=ipMacBindHandle(order,index))){ipMacList[index].oldMac=ipMacList[index].mac.toUpperCase();data=$.result.data;if(0!=data){data=data.substring(0,data.lastIndexOf("\r\n"));ipMacList[index].name=data}if(""==ipMacList[index].name){ipMacList[index].name=label.anonymousHost}$.setTimeout(ipMacMapRefresh,1000)}return result}function ipMacBindListInit(){var bindData=$.readEx(STACTRLTBL_DATA_ID);var listIndex=0,item,bindDataItem;ipMacList=[];for(var index in bindData.list){bindDataItem=bindData.list[index];if(1!=bindDataItem.bindEntry){continue}item=ipMacList[listIndex]={};for(var prop in bindDataItem){item[prop]=bindDataItem[prop]}item.oldMac=bindDataItem.mac.toUpperCase();item.mac=item.mac.toUpperCase();if(""==item.name){item.name=label.anonymousHost}listIndex++}}function ipMacBindRefresh(){ipMacBindListInit();dataGridBind.setDataSource(ipMacList);dataGridBind.refresh()}function ipMacBindLeaseInit(){ipMacBindListInit();dataGridBind=new DataGrid();dataGridBind.init({id:"ipMacBindLease",data:ipMacList,head:[{field:label.host,width:120},{field:label.mac,width:195},{field:label.ipAddr,width:140}],list:[{name:"name",maxLength:16},{name:"mac",type:"mac"},{name:"ip",type:"ip"}],checkIndex:2,toolBar:{id:"ipMacBindLsUl",delAll:ipMacBindDelAll,delSel:ipMapBindDelSel,save:ipMapBindSave}})}var dataGridMap;var dataGridBind;var ipMacList=[],ipMacMap=[];ipMacMapLeaseInit();ipMacBindLeaseInit()}init();</script>
