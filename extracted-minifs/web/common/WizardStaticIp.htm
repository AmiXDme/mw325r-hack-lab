<script type="text/javascript">function init(){function errHandle(errNo){switch(errNo){case ENONE:return false;case EINVNET:showNote("wzdIpNote",errStr.ipAddrNetErr);break;case EINVIP:showNote("wzdIpNote",errStr.ipAddrErr);break;case EINVIPFMT:showNote("wzdIpNote",errStr.ipAddrFmtNoteErr);break;case EINVGROUPIP:showNote("wzdIpNote",errStr.ipAddrGroupErr);break;case EINVLOOPIP:showNote("wzdIpNote",errStr.ipAddrLoopErr);break;case EINVMASK:showNote("wzdMaskNote");break;case EINVNETID:case EINVHOSTID:case EINVIPMASKPAIR:showNote("wzdIpNote",errStr.ipAddrMaskNotMatchNote);break;case ECOMFLICTNET:showNote("wzdIpNote",errStr.ipAddrLanWanConflictShortNote);$("#wzdIpNote .noteCon p").width(380);break;case EINVGTW:showNote("wzdGatewayNote");break;case EINVFDNSVR:showNote("wzdPrimDnsNote");break;case EINVSDNSVR:showNote("wzdSeDnsNote");break;default:break}return true}function checkLanConflict(ipVal,maskVal){var lanIp=transIp(lan.ip),lanMask=transIp(lan.mask);var stcIp=transIp(ipVal),stcMask=transIp(maskVal);return(0==((lanIp^stcIp)&lanMask&stcMask))?ECOMFLICTNET:ENONE}function checkGateway(value){return ENONE!=checkIp(value)?EINVGTW:ENONE}function checkPrimDns(value){if(lan.ip==value){return EINVFDNSVR}return ENONE!=checkIp(value)?EINVFDNSVR:ENONE}function checkSeDns(value){if(""==value||"0.0.0.0"==value){id("dns1").value="0.0.0.0";return ENONE}if(lan.ip==value){return EINVSDNSVR}return ENONE!=checkIp(value)?EINVSDNSVR:ENONE}function onSave(){var stcIp=$.findBlock(STATIC_IP_DATA_ID),link=$.findBlock(LINK_DATA_ID);var ipVal=id("ip").value,maskVal=id("mask").value,gatewayVal=id("gateway").value;var primDnsVal=id("dns0").value,seDnsVal=id("dns1").value;closeNote("wzdIpNote");closeNote("wzdMaskNote");closeNote("wzdGatewayNote");closeNote("wzdPrimDnsNote");closeNote("wzdSeDnsNote");if(errHandle(checkIp(ipVal))||errHandle(checkMask(maskVal))||errHandle(checkIpMask(ipVal,maskVal))||errHandle(checkLanConflict(ipVal,maskVal))||errHandle(checkGateway(gatewayVal))||errHandle(checkPrimDns(primDnsVal))||errHandle(checkSeDns(seDnsVal))){return}seDnsVal=id("dns1").value;stcIp.ip=ipVal;stcIp.mask=maskVal;stcIp.gateway=gatewayVal;stcIp.dns[0]=primDnsVal;stcIp.dns[1]=seDnsVal;link.linkType=LINK_TYPE_STATIC_IP;loadPage("WizardWireless.htm","wizardCon",doNothing)}var stcIp=$.findBlock(STATIC_IP_DATA_ID);var lan=$.findBlock(LAN_DATA_ID);wzdConSet({height:"640px"});selectInit("netModeSel",options,LINK_TYPE_STATIC_IP,netWorkModeChange);wzdStopSet();id("sub").onclick=onSave;id("ip").value=stcIp.ip;id("mask").value=stcIp.mask;id("gateway").value=stcIp.gateway;id("dns0").value=stcIp.dns[0]||"";id("dns1").value=stcIp.dns[1]||""}init();</script>

		</ul>

</ul>
